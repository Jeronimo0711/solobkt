<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKT</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hint" id="hint">toca una canción</div>

    <a href="https://instagram.com/jerobkt" target="_blank" rel="noopener noreferrer" class="creditos">@jerobkt</a>

    <div class="fondo-emojis" id="fondoEmojis"></div>

    <div class="canciones" id="canciones"></div>

    <div class="hero">
        <h1 class="nombre nombre--bkt">BKT</h1>
    </div>

    <div class="widget" id="widget">
        <button class="widget__cerrar" id="cerrarWidget">✕</button>

        <div class="widget__contenido">
            <div class="walkman" id="vinilo">
                <div class="walkman__marca">BROKEN TEDDY</div>

                <div class="walkman__pantalla">
                    <h2 id="widgetTitulo"></h2>
                    <p id="widgetLetra"></p>
                </div>

                <div class="walkman__botones-superiores">
                    <span>HOME</span>
                    <span>POWER</span>
                </div>

                <div class="walkman__dpad">
                    <button class="walkman__back">BACK</button>
                    <button class="walkman__option">OPTION</button>
                    <div class="walkman__play">►❙❙</div>
                    <span class="walkman__flecha walkman__flecha--arriba">▲</span>
                    <span class="walkman__flecha walkman__flecha--abajo">▼</span>
                    <span class="walkman__flecha walkman__flecha--izq">◄</span>
                    <span class="walkman__flecha walkman__flecha--der">►</span>
                </div>

                <div class="walkman__logo">WALKMAN</div>
            </div>
        </div>

        <audio id="widgetAudio"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
